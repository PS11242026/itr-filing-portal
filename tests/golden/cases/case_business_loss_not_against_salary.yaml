# AY 2026-27 engine calibration -- case 2 of 10.
# Sec 71(2A): an F&O loss eats other sources and capital gains but never
# salary. The speculation loss is ring-fenced by Sec 73 and carried forward
# on its own, as are five earlier years' business losses.
#
# Expected values are read off a practitioner-software computation for a
# real return. The assessee's identity, date of birth, address, employer
# and bank names and challan numbers are replaced with neutral stand-ins
# that preserve the tax behaviour exactly -- the DOB stand-in keeps the
# same senior-citizen age band, which drives the slabs and the 234B/234C
# waiver. Every rupee figure is untouched: that is what is being pinned.
