  ay: "2026-27"
  personal: {dob: "1985-01-01", resident_status: Non-Resident}
  regime_election: new
  filing_date: "2026-07-18"
  capital_gains:
    - asset_class: property
      description: Flat
      acquisition_date: "2011-08-04"
      transfer_date: "2025-12-20"
      full_value_consideration: 4000000
      stamp_duty_value: 4000000
      cost_of_acquisition: 1730375
      buyer_name: Buyer A
  other_sources:
    savings_interest: 14381
    fd_interest: 22572
