# AY 2026-27 engine calibration -- case 5 of 10.
# Non-resident selling a flat: the 20%-with-indexation option in the proviso
# to Sec 112(1) is closed to them, and no basic-exemption shelter applies to
# special-rate income.
#
# Expected values are read off a practitioner-software computation for a
# real return. The assessee's identity, date of birth, address, employer
# and bank names and challan numbers are replaced with neutral stand-ins
# that preserve the tax behaviour exactly -- the DOB stand-in keeps the
# same senior-citizen age band, which drives the slabs and the 234B/234C
# waiver. Every rupee figure is untouched: that is what is being pinned.
name: case_non_resident_property_ltcg
verified_against_utility: false
inputs:
  ay: "2026-27"
  personal: {dob: "1985-01-01", resident_status: Non-Resident}
  regime_election: new
  filing_date: "2026-07-18"
  capital_gains:
    - asset_class: property
      description: Flat
      acquisition_date: "2011-08-04"
      transfer_date: "2025-12-20"
      full_value_consideration: 4000000
      stamp_duty_value: 4000000
      cost_of_acquisition: 1730375
      buyer_name: Buyer A
    - asset_class: listed_other
      description: Debt mutual fund (no STT)
      acquisition_date: "2025-04-20"
      transfer_date: "2026-03-20"
      full_value_consideration: 50000
      cost_of_acquisition: 49952
  other_sources:
    savings_interest: 3692
  tds:
    - {tan: MUMH00554H, deductor: Bank A, section: "195",
       amount: 573167}
expected:
  new:
    gti: 2273365
    total_income: 2273370
    normal_income: 3745
    slab_tax: 0
    special_tax: 283703
    cess: 11348
    tax_liability: 295051
    tds_total: 573167
    fee_234f: 0
    payable_or_refund: -278120
