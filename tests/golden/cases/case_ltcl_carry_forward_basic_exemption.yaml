# AY 2026-27 engine calibration -- case 4 of 10.
# A current-year 112A long-term loss may not meet a 111A short-term gain
# (Sec 74); the unexhausted basic exemption shelters that gain instead.
#
# Expected values are read off a practitioner-software computation for a
# real return. The assessee's identity, date of birth, address, employer
# and bank names and challan numbers are replaced with neutral stand-ins
# that preserve the tax behaviour exactly -- the DOB stand-in keeps the
# same senior-citizen age band, which drives the slabs and the 234B/234C
# waiver. Every rupee figure is untouched: that is what is being pinned.
name: case_ltcl_carry_forward_basic_exemption
verified_against_utility: false
inputs:
  ay: "2026-27"
  personal: {dob: "1985-01-01", resident_status: Resident}
  regime_election: new
  filing_date: "2026-07-28"
  capital_gains:
    - asset_class: listed_equity_stt
      description: Listed equity (STT paid) — short-term
      acquisition_date: "2025-01-01"
      transfer_date: "2025-04-25"
      full_value_consideration: 31590
      cost_of_acquisition: 29284
    - asset_class: equity_mf
      description: Equity mutual funds — long-term
      acquisition_date: "2024-05-21"
      transfer_date: "2026-02-09"
      full_value_consideration: 195236
      cost_of_acquisition: 198983
  other_sources:
    savings_interest: 5044
    fd_interest: 14117
    dividend: 7602
    other: 350000
expected:
  new:
    gti: 379069
    total_income: 379070
    slab_tax: 0
    special_tax: 0
    tax_liability: 0
    fee_234f: 0
    payable_or_refund: 0
