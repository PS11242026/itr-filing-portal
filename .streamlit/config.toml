# Shared by local runs and the hosted public demo. The local-only bind
# (localhost:8511) is passed on the command line by run_portal.bat; to share
# on the office LAN, change --server.address there to the machine's LAN IP
# and keep the firewall rule restricted to the office subnet.
[server]
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#4dabf7"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
